name: ci
on: [push, pull_request]
env:
  # The commands CI runs live in yatr.toml, so `yatr ci` locally is the same gate.
  YATR_VERSION: "1.1.0"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}
      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        # RUSTFLAGS cleared so yatr does not inherit this project's flags.
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked
        env:
          RUSTFLAGS: ""
      - run: yatr fmt-check
      - run: yatr lint
      - run: yatr test
